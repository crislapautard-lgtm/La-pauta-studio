- name: Create Icon (Fixed)
  shell: powershell
  run: |
    $bmp = New-Object System.Drawing.Bitmap('Assets/icon.png')
    $hicon = $bmp.GetHicon()
    $icon = [System.Drawing.Icon]::FromHandle($hicon)
    $fs = [System.IO.File]::Create('Assets/icon.ico')
    $icon.Save($fs)
    $fs.Close()
    Write-Host "Icono creado bien"
