name: Build Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build Installer
        run: makensis installer.nsi
        
