name: Build La Pauta Studio

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository and JUCE submodule
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download JUCE Framework
      uses: actions/checkout@v4
      with:
        repository: juce-framework/JUCE
        path: JUCE
        ref: 8.0.0 # O puedes dejarlo sin ref para que baje la última versión estable

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: La-Pauta-Studio-Windows
        path: build/La-Pauta-Studio_artefacts/Release/
        
