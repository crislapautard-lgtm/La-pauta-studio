name: Build Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. Configura el entorno de compilación de C++ / CMake
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # 2. Compila el código fuente de tu DAW para generar el .exe real
      - name: Build Project
        run: cmake --build build --config Release

      # 3. Prepara la carpeta con los archivos binarios compilados
      - name: Prepare Files
        run: |
          mkdir OutputFiles
          xcopy /s /y build\Release\* OutputFiles\

      # 4. Genera el instalador con Inno Setup apuntando a los binarios
      - name: Build Installer with Inno Setup
        run: iscc installer.iss

      # 5. Sube el instalador resultante como artefacto de descarga
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaPautaStudio-Installer
          path: LaPautaStudio_Installer.exe
          
