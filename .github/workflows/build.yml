name: Build Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. Configurar CMake para compilar el DAW
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # 2. Compilar el proyecto para generar el archivo ejecutable real
      - name: Build Project
        run: cmake --build build --config Release

      # 3. Crear la carpeta y copiar los binarios generados de forma segura
      - name: Prepare Files
        run: |
          mkdir OutputFiles
          xcopy /s /y build\Release\* OutputFiles\

      # 4. Construir el instalador con Inno Setup
      - name: Build Installer with Inno Setup
        run: iscc installer.iss

      # 5. Subir el artefacto final
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaPautaStudio-Installer
          path: LaPautaStudio_Installer.exe
          
